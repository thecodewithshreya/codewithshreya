<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Boxing and Unboxing</title>
  <desc id="desc">Boxing wraps a value type as object. Unboxing extracts it back.</desc>
