<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">.NET developer learning roadmap</title>
  <desc id="desc">A staged roadmap showing what to learn to become a .NET developer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0f231c"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2 2 L12 7 L2 12 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1080" cy="120" r="150" fill="#22c55e" opacity="0.07"/>
  <circle cx="160" cy="640" r="190" fill="#38bdf8" opacity="0.07"/>

  <text x="60" y="72" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="750">How To Become A .NET Developer</text>
  <text x="60" y="112" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Build one real project while adding each layer of the stack.</text>

  <path d="M154 360 H1050" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <path d="M154 360 H1050" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 12" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="175" width="230" height="150" rx="18" fill="#0f172a" stroke="#1d4ed8"/>
    <rect x="92" y="197" width="72" height="36" rx="18" fill="url(#card1)"/>
    <text x="114" y="221" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">1</text>
    <text x="92" y="266" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">C# Basics</text>
    <text x="92" y="296" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">OOP, collections, LINQ, async</text>

    <rect x="350" y="175" width="230" height="150" rx="18" fill="#0f172a" stroke="#047857"/>
    <rect x="372" y="197" width="72" height="36" rx="18" fill="url(#card2)"/>
    <text x="394" y="221" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">2</text>
    <text x="372" y="266" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">SQL + EF Core</text>
    <text x="372" y="296" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Tables, joins, migrations, queries</text>

    <rect x="630" y="175" width="230" height="150" rx="18" fill="#0f172a" stroke="#b45309"/>
    <rect x="652" y="197" width="72" height="36" rx="18" fill="url(#card3)"/>
    <text x="674" y="221" fill="#111827" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">3</text>
    <text x="652" y="266" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">ASP.NET Core</text>
    <text x="652" y="296" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">APIs, validation, middleware</text>

    <rect x="910" y="175" width="230" height="150" rx="18" fill="#0f172a" stroke="#7c3aed"/>
    <rect x="932" y="197" width="72" height="36" rx="18" fill="#8b5cf6"/>
    <text x="954" y="221" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">4</text>
    <text x="932" y="266" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Auth + Tests</text>
    <text x="932" y="296" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Identity, roles, unit tests</text>

    <rect x="210" y="395" width="230" height="150" rx="18" fill="#0f172a" stroke="#0891b2"/>
    <rect x="232" y="417" width="72" height="36" rx="18" fill="#06b6d4"/>
    <text x="254" y="441" fill="#083344" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">5</text>
    <text x="232" y="486" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Frontend Basics</text>
    <text x="232" y="516" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">HTML, CSS, JS, Razor or Blazor</text>

    <rect x="490" y="395" width="230" height="150" rx="18" fill="#0f172a" stroke="#4f46e5"/>
    <rect x="512" y="417" width="72" height="36" rx="18" fill="#6366f1"/>
    <text x="534" y="441" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">6</text>
    <text x="512" y="486" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Git + Debugging</text>
    <text x="512" y="516" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Branches, logs, stack traces</text>

    <rect x="770" y="395" width="230" height="150" rx="18" fill="#0f172a" stroke="#059669"/>
    <rect x="792" y="417" width="72" height="36" rx="18" fill="#10b981"/>
    <text x="814" y="441" fill="#052e16" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">7</text>
    <text x="792" y="486" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Deploy</text>
    <text x="792" y="516" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Config, Docker basics, Azure</text>
  </g>

</svg>
