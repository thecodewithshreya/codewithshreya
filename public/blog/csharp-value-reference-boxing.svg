<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">C# value types, reference types, boxing, and unboxing</title>
  <desc id="desc">A diagram comparing value type copying, reference type copying, and boxing in C#.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#101827"/>
      <stop offset="1" stop-color="#102018"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1060" cy="94" r="140" fill="#0ea5e9" opacity="0.08"/>
  <circle cx="130" cy="650" r="170" fill="#22c55e" opacity="0.07"/>

  <text x="60" y="72" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">C# Type Behavior In One Picture</text>
  <text x="60" y="112" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">The interview answer is about what gets copied, not only where memory lives.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="160" width="330" height="455" rx="20" fill="#0f172a" stroke="#1e3a8a"/>
    <rect x="86" y="190" width="278" height="54" rx="14" fill="url(#blue)"/>
    <text x="112" y="225" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Value Type Copy</text>
    <text x="86" y="286" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Each variable has its own value.</text>

    <rect x="94" y="326" width="112" height="82" rx="14" fill="#111827" stroke="#38bdf8"/>
    <text x="120" y="358" fill="#93c5fd" font-family="Consolas, monospace" font-size="18">a</text>
    <text x="122" y="388" fill="#f8fafc" font-family="Consolas, monospace" font-size="24">10</text>

    <path d="M212 367 H252" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="220" y="346" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">copy</text>

    <rect x="258" y="326" width="112" height="82" rx="14" fill="#111827" stroke="#38bdf8"/>
    <text x="284" y="358" fill="#93c5fd" font-family="Consolas, monospace" font-size="18">b</text>
    <text x="286" y="388" fill="#f8fafc" font-family="Consolas, monospace" font-size="24">20</text>

    <rect x="86" y="458" width="278" height="96" rx="14" fill="#020617" stroke="#334155"/>
    <text x="106" y="493" fill="#f8fafc" font-family="Consolas, monospace" font-size="18">int b = a;</text>
    <text x="106" y="526" fill="#f8fafc" font-family="Consolas, monospace" font-size="18">b = 20;</text>
    <text x="106" y="575" fill="#a7f3d0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Result: a is still 10.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="435" y="160" width="330" height="455" rx="20" fill="#0f172a" stroke="#166534"/>
    <rect x="461" y="190" width="278" height="54" rx="14" fill="url(#green)"/>
    <text x="487" y="225" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Reference Type Copy</text>
    <text x="461" y="286" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Variables can point to the same object.</text>

    <rect x="469" y="326" width="88" height="70" rx="14" fill="#111827" stroke="#34d399"/>
    <text x="492" y="357" fill="#86efac" font-family="Consolas, monospace" font-size="18">first</text>
    <rect x="469" y="426" width="88" height="70" rx="14" fill="#111827" stroke="#34d399"/>
    <text x="486" y="457" fill="#86efac" font-family="Consolas, monospace" font-size="18">second</text>

    <rect x="622" y="358" width="112" height="106" rx="18" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
    <text x="648" y="394" fill="#bbf7d0" font-family="Consolas, monospace" font-size="18">Student</text>
    <text x="646" y="429" fill="#f8fafc" font-family="Consolas, monospace" font-size="18">Name</text>
    <text x="646" y="454" fill="#f8fafc" font-family="Consolas, monospace" font-size="18">Aman</text>

    <path d="M558 361 C585 361 592 383 615 397" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M558 461 C586 461 592 438 615 424" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

    <rect x="461" y="535" width="278" height="44" rx="14" fill="#020617" stroke="#334155"/>
    <text x="482" y="564" fill="#a7f3d0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Result: both see the changed object.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="810" y="160" width="330" height="455" rx="20" fill="#0f172a" stroke="#92400e"/>
    <rect x="836" y="190" width="278" height="54" rx="14" fill="url(#amber)"/>
    <text x="862" y="225" fill="#111827" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Boxing And Unboxing</text>
    <text x="836" y="286" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">A value type is wrapped as an object.</text>

    <rect x="850" y="330" width="102" height="70" rx="14" fill="#111827" stroke="#f59e0b"/>
    <text x="879" y="359" fill="#fde68a" font-family="Consolas, monospace" font-size="18">int</text>
    <text x="885" y="386" fill="#f8fafc" font-family="Consolas, monospace" font-size="24">101</text>

    <path d="M959 365 H1004" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="960" y="344" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">box</text>

    <rect x="1010" y="322" width="104" height="86" rx="16" fill="#431407" stroke="#fb923c"/>
    <text x="1032" y="354" fill="#fed7aa" font-family="Consolas, monospace" font-size="17">object</text>
    <text x="1042" y="383" fill="#f8fafc" font-family="Consolas, monospace" font-size="22">101</text>

    <path d="M1010 463 H960" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="961" y="443" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">unbox</text>

    <rect x="850" y="424" width="102" height="70" rx="14" fill="#111827" stroke="#f59e0b"/>
    <text x="879" y="453" fill="#fde68a" font-family="Consolas, monospace" font-size="18">int</text>
    <text x="885" y="480" fill="#f8fafc" font-family="Consolas, monospace" font-size="24">101</text>

    <rect x="836" y="535" width="278" height="44" rx="14" fill="#020617" stroke="#334155"/>
    <text x="858" y="564" fill="#fde68a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Useful model: value -> object -> value.</text>
  </g>
</svg>
