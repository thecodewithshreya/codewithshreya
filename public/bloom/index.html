<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bloom Tasks</title>
  <meta name="description" content="A calm, beautiful task list." />
  <meta name="theme-color" content="#fff9f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Bloom Tasks" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><span class="flower">✿</span> bloom<span class="brand-light">tasks</span></div>
      <div class="date" id="date"></div>
    </header>
    <section class="hero">
      <div class="eyebrow">YOUR LITTLE SPACE TO GROW ✨</div>
      <h1>Make today<br/><em>beautiful.</em></h1>
      <p>Small steps, lovely progress.</p>
      <div class="hero-art" aria-hidden="true">✿<span>✦</span></div>
    </section>
    <section class="progress-card" aria-label="Daily progress">
      <div class="progress-top"><strong>Today's progress</strong><span id="progressText">0 of 0 done</span></div>
      <div class="track"><div id="progressBar" class="fill"></div></div>
      <p id="encouragement">Every little step counts 🌷</p>
    </section>
    <section class="tasks">
      <div class="section-title"><h2>My tasks <span id="count">0</span></h2><button id="clearDone" class="text-button" type="button">Clear done</button></div>
      <form id="taskForm" class="add-form">
        <input id="taskInput" maxlength="120" required autocomplete="off" placeholder="What would you like to do?" aria-label="New task" />
        <button class="add" type="submit" aria-label="Add task">+</button>
      </form>
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="active" data-filter="all" type="button">All</button>
        <button data-filter="active" type="button">To do</button>
        <button data-filter="done" type="button">Completed</button>
      </div>
      <ul id="taskList" aria-live="polite"></ul>
      <p id="empty" class="empty">Your day is a blank canvas. Add a little goal ✨</p>
    </section>
    <footer>made for your brighter days ♡</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
